[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-csv-analyzer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "sample_data*", "tests*"]

[tool.fastapi]
entrypoint = "backend.main:app"
